name = "security2"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Every request goes through the worker so security headers + nonce CSP
# are applied to the static HTML as well as the API.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Single-writer key/value store. The migration below creates the class on the
# first deploy - no namespace id has to be provisioned by hand.
[[durable_objects.bindings]]
name = "VAULT"
class_name = "VaultStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultStore"]

# Non-secret settings. Secrets are set with `wrangler secret put ...`
[vars]
SESSION_TTL_SECONDS = "3600"
MAX_ATTEMPTS = "5"
LOCKOUT_SECONDS = "900"
